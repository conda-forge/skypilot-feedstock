context:
  version: "0.13.0"

recipe:
  name: skypilot-split
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/skypilot/skypilot-${{ version }}.tar.gz
  sha256: 0bd0c59a649d59fa21f1093534318e6c2f50b30e10fb3f54f4d702acf2615fb7
  patches:
    # pip-check looks for casbin, which was renamed to pycasin upstrean.
    - casbin_is_pycasbin.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - sky  =  sky.cli:cli

outputs:
  - package:
      name: skypilot
    requirements:
      host:
        - python ${{ python_min }}.*
        - setuptools >=58.0
        - pip
      run:
        - python >=${{ python_min }}
        - aiofiles
        - aiohttp >=3.13.3
        - aiosqlite
        - alembic >=1.8.0
        - anyio
        - asyncpg
        - bcrypt ==4.0.1
        - cachetools
        - pycasbin
        - click >=7.0,<8.2.0
        - colorama
        - cryptography
        - fastapi
        - filelock >=3.15.0
        - gitpython
        - greenlet
        - httpx
        - ijson
        - jinja2 >=3.0
        - jsonschema
        - networkx
        - orjson
        - packaging
        - pandas >=1.3.0
        - paramiko
        - passlib
        - pendulum
        - pip
        - prettytable >=2.0.0
        - prometheus_client >=0.8.0
        - psutil
        - psycopg2-binary
        - pulp
        - pydantic !=2.0,!=2.1.*,!=2.2.*,!=2.3.*,!=2.4.*,<3,>2
        - pyjwt
        - python-dotenv
        - python-multipart
        - pyyaml >3.13,!=5.4.*
        - requests
        - rich
        - setproctitle
        - setuptools
        - sqlalchemy >=2.0.16
        - sqlalchemy_adapter
        - tabulate
        - tqdm
        - types-paramiko
        - typing_extensions
        - uvicorn >=0.33.0,<0.36.0
        - wheel >=0.46.3
    tests:
      - python:
          python_version:
            - ${{ python_min }}.*
            - "*"
          imports:
            - sky
          pip_check: true

# There are more than 30 extras options:
# aws, azure, cloudflare, coreweave, cudo, do, docker, fluidstack, gcp, huggingface, hyperbolic,
# ibm, kubernetes, lambda, mithril, nebius, oci, paperspace, primeintellect, remote, runpod, scp,
# seeweb, server, shadeform, slurm, ssh, vast, vastdata, verda, vsphere, yotta.
# I will aggregate them all into one until we have better tools to handle optional dependencies updates.
# NB: There are some extras that differ! What a nightmare to install!!
# I'll use what the solver can return here prioritizing updates dependencies.

  - package:
      name: skypilot-extras
    requirements:
      host:
        - python ${{ python_min }}.*
        - setuptools
        - pip
      run:
        - ${{ pin_subpackage('skypilot', exact=True) }}
        - awscli >=1.27.10
        - azure-common
        - azure-core >=1.24.0
        - azure-core >=1.31.0
        - azure-identity>=1.19.0
        - azure-mgmt-compute >=33.0.0
        # NB: Missing version of dependency on conda-forge.
        # - azure-cli >=2.65.0,<2.87.0
        # - azure-mgmt-network >=27.0.0
        - azure-storage-blob >=12.23.1
        - boto3 >=1.26.1
        - botocore >=1.29.10
        - colorama <0.4.7
        - docker-py
        - google-api-python-client >=2.69.0
        - google-cloud-storage
        - grpcio >=1.63.0
        - huggingface_hub >=1.5
        - ibm-cloud-sdk-core
        - ibm-cos-sdk
        - ibm-platform-services >=0.48.0
        - msgraph-sdk
        - msrestazure
        - oci
        - passlib
        - protobuf >=5.29.6,<7.0.0
        - pycares<5
        - pydantic !=2.0.*,!=2.1.*,!=2.2.*,!=2.3.*,!=2.4.*,<3,>2
        - pyjwt
        - pyopenssl >=23.2.0
        - python-dateutil
        - python-dotenv
        - python-hostlist
        - python-kubernetes !=32.0.0,<36.0.0,>=20.0.0
        - python-multipart
        - pyvmomi ==8.0.1.0.2
        - pyyaml !=5.4.*,>3.13
        - ray-core >=2.6.1
        - sqlalchemy_adapter
        - tomli
        - websockets
        # Not on conda-forge.
        # - cudo-compute >=0.1.10
        # - ecsapi ==0.4.0
        # - ibm-vpc
        # - nebius >=0.3.59
        # - pydo >=0.3.0
        # - runpod >=1.6.1
        # - vastai-sdk >=0.1.12

    tests:
      - python:
          python_version:
            - ${{ python_min }}.*
            - "*"
          pip_check: true
          imports:
            - sky

about:
  summary: "SkyPilot: An intercloud broker for the clouds"
  homepage: https://github.com/skypilot-org/skypilot
  repository: https://github.com/skypilot-org/skypilot
  documentation: https://docs.skypilot.co/en/latest/
  license: Apache-2.0
  license_file: LICENSE

extra:
  feedstock_name: skypilot
  recipe-maintainers:
    - rsignell
    - ocefpaf
    - maresb
