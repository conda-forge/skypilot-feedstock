# KNOWN BLOCKER: this recipe cannot build until casbin and sqlalchemy_adapter
# are packaged on conda-forge. Both became core requirements of skypilot in
# 0.10.0, so every release from 0.10.0 onwards is affected; 0.9.3 was the last
# buildable one. Neither has ever been submitted to staged-recipes, and no
# issue or PR anywhere in the conda-forge org mentions them.
#
# Both are pure-Python and Apache-2.0, but PyCasbin publishes the same code
# under two PyPI names, and the wheels for both install a top-level 'casbin'
# module (plus, oddly, a node_modules directory):
#     casbin    1.43.0   <- what skypilot requires
#     pycasbin  2.8.0    <- what sqlalchemy_adapter requires
# Two conda packages cannot both own site-packages/casbin, so packaging them
# as-is would produce a conflict. The sqlalchemy-adapter recipe should depend
# on whichever of the two gets a feedstock, rather than mirroring its upstream
# pycasbin requirement.
context:
  version: "0.13.0"
  python_min: '3.9'

recipe:
  name: skypilot
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/s/skypilot/skypilot-${{ version }}.tar.gz
    sha256: 0bd0c59a649d59fa21f1093534318e6c2f50b30e10fb3f54f4d702acf2615fb7

build:
  script: ${{ PYTHON }} -m pip install .
  python:
    entry_points:
      - sky  =  sky.cli:cli
  noarch: python
  number: 0

# One output per upstream extra. recipe/update.py derives which extras can be
# shipped by resolving every dependency to a conda-forge package and checking
# that a version satisfying the constraint exists; run it after a version bump
# rather than editing the requirements below by hand.
#
# Upstream adds cloud extras faster than anyone asks for them, so we publish an
# output only where someone actually wants it rather than claiming a package
# name on conda-forge for each one. Adding an output also means registering it
# against this feedstock through a conda-forge/admin-requests PR.
#
# AVAILABLE ON REQUEST. Every dependency of these is already on conda-forge, so
# they need nothing more than an output here. Please open an issue if you would
# like one published:
#   coreweave, fluidstack, huggingface, hyperbolic, mithril, paperspace,
#   primeintellect, server, shadeform, slurm, ssh, vastdata, verda, yotta
#
# NOT CURRENTLY POSSIBLE, because a dependency is missing from conda-forge:
#   azure      azure-mgmt-network is too old (wants >=27.0.0, has 23.0.0)
#   cudo       cudo-compute
#   do         pydo
#   ibm        ibm-vpc
#   nebius     nebius
#   runpod     runpod
#   seeweb     ecsapi
#   vast       vastai-sdk
#
# The 'all' extra is the union of the others, so it is deliberately skipped.
outputs:
  - package:
      name: skypilot
    requirements:
      host:
        - python ${{ python_min }}.*
        - setuptools
        - pip
      run:
        - python >=${{ python_min }}
        - wheel >=0.46.3
        - setuptools
        - pip
        - cachetools
        - click <8.2.0,>=7.0
        - colorama
        - cryptography
        - jinja2 >=3.0
        - jsonschema
        - networkx
        - pandas >=1.3.0
        - pendulum
        - prettytable >=2.0.0
        - python-dotenv
        - rich
        - tabulate
        - tqdm
        - typing_extensions
        - filelock >=3.15.0
        - packaging
        - psutil
        - pulp
        - pyyaml !=5.4.*,>3.13
        - ijson
        - orjson
        - requests
        - uvicorn-standard <0.36.0,>=0.33.0
        - fastapi
        - pydantic !=2.0.*,!=2.1.*,!=2.2.*,!=2.3.*,!=2.4.*,<3,>2
        - python-multipart
        - aiofiles
        - httpx
        - setproctitle
        - sqlalchemy >=2.0.16
        - psycopg2
        - aiosqlite
        - asyncpg
        - greenlet
        - casbin
        - sqlalchemy-adapter
        - prometheus_client >=0.8.0
        - passlib
        - bcrypt ==4.0.1
        - pyjwt
        - gitpython
        - paramiko
        - types-paramiko
        - alembic >=1.8.0
        - aiohttp >=3.13.3
        - anyio
    tests:
      - python:
          python_version: ${{ python_min }}.*
          imports:
            - sky
          pip_check: true

  - package:
      name: skypilot-aws
    requirements:
      host:
        - python ${{ python_min }}.*
        - setuptools
        - pip
      run:
        - awscli >=1.27.10
        - botocore >=1.29.10
        - boto3 >=1.26.1
        - colorama <0.4.7
        - aiohttp
        - grpcio >=1.63.0
        - protobuf <7.0.0,>=5.29.6
        - ${{ pin_subpackage('skypilot', exact=True) }}
    tests:
      - python:
          python_version: ${{ python_min }}.*
          pip_check: true
          imports:
            - sky
      - requirements:
          run:
            - python ${{ python_min }}.*
            - pip
        script:
          - "[ -z \"$(pip install skypilot[aws] | grep -v 'Requirement already satisfied')\" ]"

